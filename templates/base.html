<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">CRM</span>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('companies') }}" class="text-white text-decoration-none">Companies</a>
        <a href="{{ url_for('contacts') }}" class="text-white text-decoration-none ms-3">Contacts</a>
        <a href="{{ url_for('leads') }}" class="text-white text-decoration-none ms-3">Leads</a>
        <a href="{{ url_for('deals') }}" class="text-white text-decoration-none ms-3">Deals</a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Log out</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
