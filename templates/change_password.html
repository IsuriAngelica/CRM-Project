{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">{{ "Set a new password" if forced else "Change password" }}</h2>
{% if forced %}
<div class="alert alert-warning">Your account was just created. You must set your own password before continuing.</div>
{% endif %}
<form method="POST" class="col-md-4">
  {% if not forced %}
  <div class="mb-3">
    <label class="form-label">Current password</label>
    <input type="password" name="current_password" class="form-control" required>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">New password</label>
    <input type="password" name="new_password" class="form-control" required minlength="6">
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm new password</label>
    <input type="password" name="confirm_password" class="form-control" required minlength="6">
  </div>
  <button type="submit" class="btn btn-dark">{{ "Set password" if forced else "Update password" }}</button>
</form>
{% endblock %}
