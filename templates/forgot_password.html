{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="mb-3">Forgot password</h3>
    <p class="text-muted">Enter your email and we'll send you a link to reset your password.</p>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">Send reset link</button>
    </form>
    <a href="{{ url_for('login') }}" class="d-block text-center mt-3">Back to sign in</a>
  </div>
</div>
{% endblock %}
