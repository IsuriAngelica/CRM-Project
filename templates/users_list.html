{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Users</h2>
  <a href="{{ url_for('add_user') }}" class="btn btn-dark">+ Add user</a>
</div>
<table class="table table-bordered bg-white">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td><span class="badge bg-secondary">{{ user.role.replace("_", " ")|capitalize }}</span></td>
      <td><a href="{{ url_for('edit_user', user_id=user.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a></td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">No users yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
